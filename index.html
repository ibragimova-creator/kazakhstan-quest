<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тайны Казахстана</title><link rel="stylesheet" href="style.css"></head><body><main id="game"><div id="scene"><div id="background"></div><div id="fire1" class="fire"></div><div id="fire2" class="fire"></div><div id="seam"></div><div id="doors"></div><div id="traffic" hidden><div id="river-motion"></div><div id="cloud-motion"></div><div class="cityglow"></div><button id="stairs" aria-label="Подойти к лестнице" title="Подойти к лестнице"></button><div id="hotspots"></div></div></div><div id="flash"></div><div id="particles"></div><header><button id="menu-toggle" aria-label="Открыть меню">☰</button><span>ТАЙНЫ КАЗАХСТАНА</span><div id="inventory"><span>Артефакты</span><img id="key-icon" src="assets/key.webp" alt="Золотой ключ" hidden></div><span id="lives" aria-label="Жизни: 5 из 5">❤️❤️❤️❤️❤️</span><span id="score">0 / 360</span><button id="sound" aria-label="Звук">🔊</button></header><nav id="game-menu" hidden><button id="go-home">⌂ На главную</button><button id="go-back">← Назад</button></nav><section id="panel" aria-live="polite"></section><div id="notice" role="status"></div><div id="game-over" hidden role="dialog" aria-modal="true" aria-labelledby="game-over-title"><div class="retry-card"><div class="retry-heart">💛</div><h2 id="game-over-title">В этот раз не получилось!</h2><p>Не расстраивайся! Каждая попытка делает тебя ближе к победе.</p><button id="retry" class="primary">Попробовать снова</button></div></div></main><script src="game.js"></script></body></html>
